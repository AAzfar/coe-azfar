version: '3.8'

services:
  web-app:
    image: node:18
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      - database
      
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data