services:
  database:
    image: postgres:15-alpine
    env_file:
      - ./src/backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export POSTGRES_USER="$${DB_USERNAME}"
        export POSTGRES_PASSWORD="$${DB_PASSWORD}"
        export POSTGRES_DB="$${DB_DATABASE}"
        exec /usr/local/bin/docker-entrypoint.sh postgres

  pgweb:
    image: sosedoff/pgweb:latest
    ports:
      - "127.0.0.1:8081:8081"
    env_file:
      - ./src/backend/.env
    environment:
      DB_HOST: database
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export DATABASE_URL="postgres://$${DB_USERNAME}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_DATABASE}?sslmode=disable";
        exec pgweb --bind 0.0.0.0 --listen 8081
    depends_on:
      database:
        condition: service_healthy

  backend:
    build:
      context: ./src/backend
    working_dir: /var/www/html
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./src/backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_HOST: database
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      database:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f .env ]; then cp .env.example .env; fi
        if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi
        composer install --no-interaction --prefer-dist --no-progress
        php artisan migrate --force
        php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./src/frontend
    working_dir: /app
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules: